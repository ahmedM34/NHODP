publish_to: none
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  google_fonts: ^6.1.0
  http: ^1.1.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.65.0
  intl: ^0.19.0
  shimmer: ^3.0.0
